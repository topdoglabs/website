<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-itunes-app" content="app-clip-bundle-id=com.mbrucedogs.BusinessCard.Clip" />
    <title>BusinessCard App Clip</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f9;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0ea5e9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at top, #e0f2fe, var(--bg) 45%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(560px, 100%);
        background: var(--card);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 20px 55px rgba(2, 8, 23, 0.12);
      }
      h1 { margin: 0 0 12px; font-size: 1.4rem; }
      p { margin: 0 0 12px; line-height: 1.5; color: var(--muted); }
      .pill {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: #e0f2fe;
        color: #0369a1;
        font-size: 0.85rem;
        margin: 10px 0 16px;
        word-break: break-all;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }
      a {
        text-decoration: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
      }
      .primary {
        background: var(--accent);
        color: #fff;
      }
      .secondary {
        background: #e2e8f0;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BusinessCard App Clip</h1>
      <p>If you are on iPhone, open this link from Camera or Messages to launch the App Clip card experience.</p>
      <p>If App Clip does not launch automatically, make sure iOS can reach this domain over HTTPS.</p>
      <div id="record" class="pill" hidden></div>
      <div class="actions">
        <a class="primary" href="/apps/businesscard">View BusinessCard App</a>
        <a class="secondary" href="/apps">Browse All Apps</a>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (id) {
        const record = document.getElementById("record");
        record.hidden = false;
        record.textContent = `Card ID: ${id}`;
      }
    </script>
  </body>
</html>
